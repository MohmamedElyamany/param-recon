name: Full Parameter Recon (Arjun + Nuclei + Dalfox + FFUF)

on:
  workflow_dispatch:   # تشغيل يدوي فقط

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git curl jq golang

          # Arjun
          pip install arjun

          # ProjectDiscovery tools
          go install -v github.com/projectdiscovery/nuclei/v2/cmd/nuclei@latest

          # Dalfox
          go install -v github.com/hahwul/dalfox/v2@latest

          # FFUF
          go install github.com/ffuf/ffuf/v2@latest

      - name: Add Go Path
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Validate input file
        run: |
          if [ ! -f output.txt ]; then
            echo "❌ ملف urls.txt غير موجود!"
            exit 1
          fi

      - name: Run Arjun (Parameter Discovery)
        run: |
          echo "🔍 Running Arjun..."
          arjun -i urls.txt -o arjun_output.json --stable

      - name: Extract URLs With Params
        run: |
          echo "🔧 Extracting URLs with parameters..."
          jq -r 'to_entries[] | .key' arjun_output.json > arjun_urls.txt

      - name: Download Nuclei Templates
        run: nuclei --update-templates

      - name: Run Nuclei Parameter Templates
        run: |
          echo "💥 Running Nuclei parameter tests..."
          nuclei -l arjun_urls.txt \
                 -t ~/nuclei-templates/http/vulnerabilities/parameter/ \
                 -t ~/nuclei-templates/http/exposures/parameters/ \
                 -severity low,medium,high,critical \
                 -o nuclei_param_results.txt

      - name: Run Dalfox XSS Scan
        run: |
          echo "🧪 Running Dalfox XSS testing..."
          while read url; do
            dalfox url "$url" >> dalfox_results.txt
          done < arjun_urls.txt

      - name: Run FFUF Parameter Fuzzing
        run: |
          echo "⚡ Running FFUF for param fuzzing..."
          mkdir ffuf_output
          if [ ! -f combined_words.txt ]; then
            echo "❌ ملف combined_words.txt غير موجود!"
            exit 1
          fi

          while read url; do
            ffuf -u "$url&FUZZ=test" \
                 -w combined_words.txt \
                 -mc 200,302,403 \
                 -t 50 \
                 -o "ffuf_output/$(echo $url | sed 's/[^a-zA-Z0-9]/_/g').json"
          done < arjun_urls.txt

      - name: Commit Results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add arjun_output.json || true
          git add arjun_urls.txt || true
          git add nuclei_param_results.txt || true
          git add dalfox_results.txt || true
          git add ffuf_output || true

          git commit -m "Full Param Scan (Arjun + Nuclei + Dalfox + FFUF)" || true
          git push || true
